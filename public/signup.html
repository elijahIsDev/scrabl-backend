<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your Scrabl account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B;
    --field:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.12);
    --accent:#D4AF37;
    --accent-soft:rgba(212,175,55,.14);
    --text:#F4F4F5;
    --subtext:#86868B;
    --faint:#5A5A5F;
    --error:#E5484D;
    --ok:#3DD68C;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui,sans-serif}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-weight:300;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* nav */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:22px 7%;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;text-decoration:none}
  .brand .leaf{display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .brand .leaf svg{width:21px;height:21px}
  .brand-name{font-size:1.2rem;font-weight:600;letter-spacing:-.02em}
  .nav-back{font-size:.88rem;color:var(--subtext);text-decoration:none;padding:8px 16px;border:1px solid var(--line-2);border-radius:9px;transition:.2s}
  .nav-back:hover{color:var(--text);border-color:var(--accent)}

  /* centered form */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px 72px}
  .form-wrap{width:100%;max-width:400px}

  .headline{font-size:2rem;font-weight:500;letter-spacing:-.03em;line-height:1.1}
  .headline .dot{color:var(--accent)}
  .subhead{color:var(--subtext);font-size:1rem;font-weight:300;margin-top:10px;margin-bottom:34px}

  .google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;padding:13px;background:transparent;color:var(--text);border:1px solid var(--line-2);border-radius:10px;font-size:.92rem;font-weight:400;cursor:pointer;transition:.2s}
  .google-btn:hover{border-color:var(--subtext)}
  .google-btn svg{width:18px;height:18px}

  .divider{display:flex;align-items:center;gap:16px;margin:24px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .divider span{color:var(--faint);font-size:.8rem}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:8px;font-weight:500}
  .input-shell{position:relative;display:flex;align-items:center}
  .input-shell input{width:100%;padding:13px 15px;background:var(--field);border:1px solid var(--line-2);border-radius:10px;color:var(--text);font-size:.95rem;font-weight:300;outline:none;transition:.2s}
  .input-shell input::placeholder{color:var(--faint)}
  .input-shell input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .toggle-eye{position:absolute;right:13px;background:none;border:none;cursor:pointer;color:var(--faint);padding:4px;display:flex;transition:.2s}
  .toggle-eye:hover{color:var(--text)}
  .toggle-eye svg{width:18px;height:18px}

  .hint{font-size:.76rem;margin-top:7px;min-height:16px;transition:.2s;font-weight:300}
  .hint.err{color:var(--error)}
  .hint.ok{color:var(--ok)}
  .hint.muted{color:var(--faint)}

  .submit-btn{width:100%;padding:14px;margin-top:6px;background:var(--accent);color:#111;border:none;border-radius:10px;font-size:.98rem;font-weight:500;cursor:pointer;transition:.2s}
  .submit-btn:hover{background:#E4C76A;transform:translateY(-1px)}
  .submit-btn:active{transform:translateY(0)}
  .submit-btn:disabled{opacity:.7;cursor:default;transform:none}

  .legal{font-size:.78rem;color:var(--faint);line-height:1.6;margin-top:20px;text-align:center;font-weight:300}
  .legal a{color:var(--subtext);text-decoration:underline;text-underline-offset:2px}
  .legal a:hover{color:var(--accent)}

  .switch{text-align:center;margin-top:26px;font-size:.9rem;color:var(--subtext);font-weight:300}
  .switch button{background:none;border:none;color:var(--accent);font-weight:500;cursor:pointer;font-size:.9rem;text-decoration:underline;text-underline-offset:2px}

  .form-note{text-align:center;font-size:.82rem;margin-top:16px;min-height:18px;color:var(--ok);transition:.2s;font-weight:300}

  @media (max-width:480px){
    .nav{padding:18px 6%}
    .headline{font-size:1.75rem}
    .subhead{font-size:.95rem;margin-bottom:28px}
    .stage{padding:32px 20px 60px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="brand">
      <span class="leaf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg></span>
      <span class="brand-name">scrabl</span>
    </a>
    <a href="index.html" class="nav-back">&larr; Back to site</a>
  </nav>

  <div class="stage">
    <div class="form-wrap">

      <h1 class="headline" id="headline">Create your account<span class="dot">.</span></h1>
      <p class="subhead" id="subhead">Start showing up every day — without the stress.</p>

      <!-- Google (styled, not wired yet) -->
      <button type="button" class="google-btn" id="google-btn">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="divider"><span>or</span></div>

      <!-- ============ SIGNUP FORM ============ -->
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="su-name">Full name</label>
          <div class="input-shell"><input type="text" id="su-name" placeholder="Your name" autocomplete="name"></div>
          <div class="hint" id="su-name-hint"></div>
        </div>
        <div class="field">
          <label for="su-email">Email address</label>
          <div class="input-shell"><input type="email" id="su-email" placeholder="you@email.com" autocomplete="email"></div>
          <div class="hint" id="su-email-hint"></div>
        </div>
        <div class="field">
          <label for="su-password">Password</label>
          <div class="input-shell">
            <input type="password" id="su-password" placeholder="At least 8 characters" autocomplete="new-password">
            <button type="button" class="toggle-eye" data-target="su-password" aria-label="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="hint muted" id="su-password-hint">Use 8 or more characters.</div>
        </div>
        <div class="field">
          <label for="su-confirm">Confirm password</label>
          <div class="input-shell">
            <input type="password" id="su-confirm" placeholder="Re-enter your password" autocomplete="new-password">
            <button type="button" class="toggle-eye" data-target="su-confirm" aria-label="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="hint" id="su-confirm-hint"></div>
        </div>
        <button type="submit" class="submit-btn">Create account</button>
        <div class="form-note" id="su-note"></div>
      </form>

      <!-- ============ LOGIN FORM (hidden) ============ -->
      <form id="login-form" novalidate style="display:none;">
        <div class="field">
          <label for="li-email">Email address</label>
          <div class="input-shell"><input type="email" id="li-email" placeholder="you@email.com" autocomplete="email"></div>
          <div class="hint" id="li-email-hint"></div>
        </div>
        <div class="field">
          <label for="li-password">Password</label>
          <div class="input-shell">
            <input type="password" id="li-password" placeholder="Your password" autocomplete="current-password">
            <button type="button" class="toggle-eye" data-target="li-password" aria-label="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="hint" id="li-password-hint"></div>
        </div>
        <button type="submit" class="submit-btn">Log in</button>
        <div class="form-note" id="li-note"></div>
      </form>

      <!-- ============ VERIFY EMAIL VIEW (hidden) ============ -->
      <div id="verify-view" style="display:none;">
        <div class="field">
          <label for="vf-code">Verification code</label>
          <div class="input-shell">
            <input type="text" id="vf-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:10px;font-size:1.2rem;">
          </div>
          <div class="hint muted" id="vf-hint">We sent a code to <span id="vf-email">your email</span>.</div>
        </div>
        <button type="button" class="submit-btn" id="verify-btn">Verify &amp; continue</button>
        <div class="form-note" id="vf-note"></div>
        <p class="switch">Didn't get it? <button type="button" id="resend-btn">Resend code</button></p>
      </div>

      <p class="legal" id="legal">
        By creating an account, you agree to Scrabl's
        <a href="terms.html">Terms of Use</a> and <a href="privacy.html">Privacy Policy</a>.
      </p>

      <p class="switch" id="switch-row">
        <span id="switch-text">Already have an account?</span>
        <button type="button" id="switch-btn">Log in</button>
      </p>

    </div>
  </div>

<script>
(function(){
  "use strict";

  // ----- password show/hide -----
  document.querySelectorAll('.toggle-eye').forEach(function(btn){
    btn.addEventListener('click', function(){
      var input = document.getElementById(btn.getAttribute('data-target'));
      if(!input) return;
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      btn.querySelector('.eye').style.opacity = showing ? '1' : '0.55';
    });
  });

  // ----- helpers -----
  function setHint(id, msg, cls){
    var el = document.getElementById(id);
    if(!el) return;
    el.textContent = msg || '';
    el.className = 'hint' + (cls ? ' ' + cls : '');
  }
  function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  // ----- live validation (signup) -----
  var suEmail = document.getElementById('su-email');
  var suPass = document.getElementById('su-password');
  var suConfirm = document.getElementById('su-confirm');

  suEmail.addEventListener('blur', function(){
    if(suEmail.value && !isEmail(suEmail.value)) setHint('su-email-hint','Enter a valid email address.','err');
    else setHint('su-email-hint','');
  });
  suPass.addEventListener('input', function(){
    if(!suPass.value) setHint('su-password-hint','Use 8 or more characters.','muted');
    else if(suPass.value.length < 8) setHint('su-password-hint','A little longer — 8 characters minimum.','err');
    else setHint('su-password-hint','Strong enough. Nice.','ok');
    if(suConfirm.value) checkMatch();
  });
  function checkMatch(){
    if(!suConfirm.value) { setHint('su-confirm-hint',''); return true; }
    if(suConfirm.value !== suPass.value){ setHint('su-confirm-hint','Passwords don\'t match yet.','err'); return false; }
    setHint('su-confirm-hint','Passwords match.','ok'); return true;
  }
  suConfirm.addEventListener('input', checkMatch);

  // ----- backend base: localhost in dev, same-origin in production (unified PXXL app) -----
  var backendBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:5500'
    : '';

  // ----- signup submit -----
  document.getElementById('signup-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var name = document.getElementById('su-name').value.trim();
    var ok = true;
    if(!name){ setHint('su-name-hint','What should we call you?','err'); ok = false; }
    else setHint('su-name-hint','');
    if(!isEmail(suEmail.value)){ setHint('su-email-hint','Enter a valid email address.','err'); ok = false; }
    if(suPass.value.length < 8){ setHint('su-password-hint','A little longer — 8 characters minimum.','err'); ok = false; }
    if(!checkMatch()) ok = false;
    if(!ok) return;

    var btn = this.querySelector('.submit-btn');
    var note = document.getElementById('su-note');
    var originalText = btn.textContent;
    btn.disabled = true; btn.textContent = 'Creating account...';
    note.style.color = 'var(--subtext)'; note.textContent = '';

    try {
      var res = await fetch(backendBase + '/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, email: suEmail.value.trim(), password: suPass.value })
      });
      var data = await res.json().catch(function(){ return {}; });

      if (res.ok) {
        try {
          localStorage.setItem('scrabl_token', data.token || '');
          localStorage.setItem('scrabl_user', JSON.stringify(data.user || {}));
        } catch(_) {}
        document.getElementById('signup-form').reset();
        setHint('su-password-hint','Use 8 or more characters.','muted');
        note.textContent = '';
        btn.disabled = false; btn.textContent = originalText;
        showVerify(suEmail.value.trim() || (data.user && data.user.email) || '');
      } else {
        note.style.color = 'var(--error)';
        note.textContent = data.error || 'Could not create your account. Please try again.';
        btn.disabled = false; btn.textContent = originalText;
      }
    } catch (err) {
      note.style.color = 'var(--error)';
      note.textContent = 'Could not reach the server. Give it a moment and try again.';
      btn.disabled = false; btn.textContent = originalText;
    }
  });

  // ----- login submit -----
  document.getElementById('login-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('li-email').value.trim();
    var pass = document.getElementById('li-password').value;
    var ok = true;
    if(!isEmail(email)){ setHint('li-email-hint','Enter a valid email address.','err'); ok = false; }
    else setHint('li-email-hint','');
    if(!pass){ setHint('li-password-hint','Enter your password.','err'); ok = false; }
    else setHint('li-password-hint','');
    if(!ok) return;

    var btn = this.querySelector('.submit-btn');
    var note = document.getElementById('li-note');
    var originalText = btn.textContent;
    btn.disabled = true; btn.textContent = 'Logging in...';
    note.style.color = 'var(--subtext)'; note.textContent = '';

    try {
      var res = await fetch(backendBase + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: pass })
      });
      var data = await res.json().catch(function(){ return {}; });

      if (res.ok) {
        try {
          localStorage.setItem('scrabl_token', data.token || '');
          localStorage.setItem('scrabl_user', JSON.stringify(data.user || {}));
        } catch(_) {}
        if (data.verified === false) {
          note.textContent = '';
          btn.disabled = false; btn.textContent = originalText;
          showVerify(email);
          return;
        }
        if (data.onboarded === false) {
          btn.textContent = 'Setting things up...';
          window.location.href = 'onboarding.html';
          return;
        }
        note.textContent = '';
        btn.textContent = 'Welcome back ✓';
        window.location.href = 'app.html';
        return;
      } else {
        note.style.color = 'var(--error)';
        note.textContent = data.error || 'Could not log you in. Please try again.';
        btn.disabled = false; btn.textContent = originalText;
      }
    } catch (err) {
      note.style.color = 'var(--error)';
      note.textContent = 'Could not reach the server. Give it a moment and try again.';
      btn.disabled = false; btn.textContent = originalText;
    }
  });

  // ----- toggle signup <-> login -----
  var mode = 'signup';
  var signupForm = document.getElementById('signup-form');
  var loginForm = document.getElementById('login-form');
  var headline = document.getElementById('headline');
  var subhead = document.getElementById('subhead');
  var legal = document.getElementById('legal');
  var switchText = document.getElementById('switch-text');
  var switchBtn = document.getElementById('switch-btn');

  switchBtn.addEventListener('click', function(){
    if(mode === 'signup'){
      mode = 'login';
      signupForm.style.display = 'none';
      loginForm.style.display = 'block';
      headline.innerHTML = 'Welcome back<span class="dot">.</span>';
      subhead.textContent = 'Log in to keep your shelf full.';
      legal.style.display = 'none';
      switchText.textContent = "Don't have an account?";
      switchBtn.textContent = 'Sign up';
    } else {
      mode = 'signup';
      signupForm.style.display = 'block';
      loginForm.style.display = 'none';
      headline.innerHTML = 'Create your account<span class="dot">.</span>';
      subhead.textContent = 'Start showing up every day — without the stress.';
      legal.style.display = 'block';
      switchText.textContent = 'Already have an account?';
      switchBtn.textContent = 'Log in';
    }
  });

  // ----- email verification view -----
  function showVerify(emailAddr){
    document.getElementById('signup-form').style.display = 'none';
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('legal').style.display = 'none';
    document.getElementById('switch-row').style.display = 'none';
    document.getElementById('verify-view').style.display = 'block';
    headline.innerHTML = 'Check your email<span class="dot">.</span>';
    subhead.textContent = 'Enter the 6-digit code we just sent you.';
    var span = document.getElementById('vf-email');
    if (span && emailAddr) span.textContent = emailAddr;
    var codeInput = document.getElementById('vf-code');
    codeInput.value = '';
    setTimeout(function(){ codeInput.focus(); }, 100);
  }

  document.getElementById('vf-code').addEventListener('input', function(){
    this.value = this.value.replace(/\D/g, '').slice(0,6);
  });

  document.getElementById('verify-btn').addEventListener('click', async function(){
    var code = document.getElementById('vf-code').value.trim();
    var vnote = document.getElementById('vf-note');
    if (code.length !== 6){
      vnote.style.color = 'var(--error)';
      vnote.textContent = 'Enter the 6-digit code.';
      return;
    }
    var token = '';
    try { token = localStorage.getItem('scrabl_token') || ''; } catch(_){}
    var btn = this, original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Verifying...';
    vnote.style.color = 'var(--subtext)'; vnote.textContent = '';

    try {
      var res = await fetch(backendBase + '/api/auth/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ code: code })
      });
      var data = await res.json().catch(function(){ return {}; });
      if (res.ok){
        if (data.onboarded === true){
          window.location.href = 'app.html';
        } else {
          btn.textContent = 'Verified ✓';
          window.location.href = 'onboarding.html';
        }
      } else {
        btn.disabled = false; btn.textContent = original;
        vnote.style.color = 'var(--error)';
        vnote.textContent = data.error || 'Could not verify. Try again.';
      }
    } catch (err) {
      btn.disabled = false; btn.textContent = original;
      vnote.style.color = 'var(--error)';
      vnote.textContent = 'Could not reach the server. Give it a moment and try again.';
    }
  });

  document.getElementById('resend-btn').addEventListener('click', async function(){
    var token = '';
    try { token = localStorage.getItem('scrabl_token') || ''; } catch(_){}
    var vnote = document.getElementById('vf-note');
    var btn = this, original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      var res = await fetch(backendBase + '/api/auth/resend-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
      });
      var data = await res.json().catch(function(){ return {}; });
      if (res.ok){
        vnote.style.color = 'var(--ok)';
        vnote.textContent = 'New code sent ✓';
      } else {
        vnote.style.color = 'var(--error)';
        vnote.textContent = data.error || 'Could not resend. Try again.';
      }
    } catch (err) {
      vnote.style.color = 'var(--error)';
      vnote.textContent = 'Could not reach the server.';
    }
    setTimeout(function(){ btn.disabled = false; btn.textContent = original; }, 2000);
  });

  document.getElementById('google-btn').addEventListener('click', function(){
    var note = document.getElementById(mode === 'signup' ? 'su-note' : 'li-note');
    note.style.color = 'var(--subtext)';
    note.textContent = 'Google sign-in is coming in the next step.';
  });

  if (location.hash === '#login' || /[?&]mode=login/.test(location.search)) {
    switchBtn.click();
  }

})();
</script>
</body>
</html>
